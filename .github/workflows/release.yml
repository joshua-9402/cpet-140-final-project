name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean
      linux_debian:
        description: 'Linux Debian/Ubuntu'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'x64'
          - 'arm64'
          - 'skip'
      linux_rpm:
        description: 'Linux Fedora/Red Hat'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'x64'
          - 'arm64'
          - 'skip'
      linux_suse:
        description: 'Linux SUSE'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'x64'
          - 'arm64'
          - 'skip'
      macos:
        description: 'macOS'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'arm64'
          - 'intel'
          - 'skip'
      windows:
        description: 'Windows'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'x64'
          - 'arm64'
          - 'skip'

jobs:
  build-linux-debian:
    name: Linux Debian/Ubuntu (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm64' || 'ubuntu-latest' }}
    if: inputs.linux_debian != 'skip'
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.linux_debian == 'both' && '["x64", "arm64"]' || inputs.linux_debian == 'x64' && '["x64"]' || '["arm64"]') }}
    container:
      image: ubuntu:22.04

    steps:
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y build-essential git cmake ninja-build file libglfw3-dev \
          libwayland-dev wayland-protocols \
          libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev \
          libglu1-mesa-dev libfreetype6-dev libfontconfig1-dev pkg-config fakeroot

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure and Build
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja -DCPACK_PACKAGE_VERSION=${{ inputs.version }}
        cmake --build build --config Release -j $(nproc)

    - name: Package (TGZ fallback)
      run: |
        mkdir -p artifact
        cp build/structuracost artifact/
        [ -d "assets" ] && cp -r assets artifact/
        ARCH_NAME="${{ matrix.arch }}"; [ "$ARCH_NAME" = "x64" ] && ARCH_NAME="x86_64"
        cd artifact && tar -czf ../structuracost-linux-debian-${ARCH_NAME}-${{ inputs.version }}.tar.gz * && cd ..

    - name: Build DEB installer via CPack
      run: |
        cmake -B build -DCPACK_GENERATOR=DEB -DCPACK_PACKAGE_VERSION=${{ inputs.version }}
        cmake --build build --target package
        ls -1 build | grep -E '\.deb$' || true

    - name: Collect Debian installer
      run: |
        mkdir -p installers
        find build -maxdepth 1 -type f -name "*.deb" -exec cp {} installers/ \; || true
        ARCH_NAME="${{ matrix.arch }}"; [ "$ARCH_NAME" = "x64" ] && ARCH_NAME="x86_64"
        if ls installers/*.deb 1> /dev/null 2>&1; then
          for f in installers/*.deb; do mv "$f" installers/structuracost-linux-debian-${ARCH_NAME}-${{ inputs.version }}.deb; done
        fi

    - name: Upload Debian artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-debian-${{ matrix.arch }}
        path: |
          installers/structuracost-linux-debian-${{ matrix.arch == 'x64' && 'x86_64' || matrix.arch }}-${{ inputs.version }}.deb
        retention-days: 7

    - name: Upload Debian archive (separate)
      uses: actions/upload-artifact@v4
      with:
        name: linux-debian-${{ matrix.arch }}-archive
        path: structuracost-linux-debian-${{ matrix.arch == 'x64' && 'x86_64' || matrix.arch }}-${{ inputs.version }}.tar.gz
        retention-days: 7

  build-linux-rpm:
    name: Linux RPM (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm64' || 'ubuntu-latest' }}
    if: inputs.linux_rpm != 'skip'
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.linux_rpm == 'both' && '["x64", "arm64"]' || inputs.linux_rpm == 'x64' && '["x64"]' || '["arm64"]') }}
    container:
      image: fedora:latest

    steps:
    - name: Install dependencies
      run: |
        dnf install -y gcc gcc-c++ git cmake ninja-build file glfw-devel \
          wayland-devel wayland-protocols-devel \
          libXrandr-devel libXinerama-devel libXcursor-devel libXi-devel \
          mesa-libGL-devel mesa-libGLU-devel freetype-devel fontconfig-devel pkg-config rpm-build

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure and Build
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja -DCPACK_PACKAGE_VERSION=${{ inputs.version }}
        cmake --build build --config Release -j $(nproc)

    - name: Package (TGZ fallback)
      run: |
        mkdir -p artifact
        cp build/structuracost artifact/
        [ -d "assets" ] && cp -r assets artifact/
        ARCH_NAME="${{ matrix.arch }}"; [ "$ARCH_NAME" = "x64" ] && ARCH_NAME="x86_64"
        cd artifact && tar -czf ../structuracost-linux-rpm-${ARCH_NAME}-${{ inputs.version }}.tar.gz * && cd ..

    - name: Build RPM installer via CPack
      run: |
        cmake -B build -DCPACK_GENERATOR=RPM -DCPACK_PACKAGE_VERSION=${{ inputs.version }}
        cmake --build build --target package
        ls -1 build | grep -E '\.rpm$' || true

    - name: Collect RPM installer
      run: |
        mkdir -p installers
        find build -maxdepth 1 -type f -name "*.rpm" -exec cp {} installers/ \; || true
        ARCH_NAME="${{ matrix.arch }}"; [ "$ARCH_NAME" = "x64" ] && ARCH_NAME="x86_64"
        if ls installers/*.rpm 1> /dev/null 2>&1; then
          for f in installers/*.rpm; do mv "$f" installers/structuracost-linux-rpm-${ARCH_NAME}-${{ inputs.version }}.rpm; done
        fi

    - name: Upload RPM artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-rpm-${{ matrix.arch }}
        path: |
          installers/structuracost-linux-rpm-${{ matrix.arch == 'x64' && 'x86_64' || matrix.arch }}-${{ inputs.version }}.rpm
        retention-days: 7

    - name: Upload RPM archive (separate)
      uses: actions/upload-artifact@v4
      with:
        name: linux-rpm-${{ matrix.arch }}-archive
        path: structuracost-linux-rpm-${{ matrix.arch == 'x64' && 'x86_64' || matrix.arch }}-${{ inputs.version }}.tar.gz
        retention-days: 7

  build-linux-suse:
    name: Linux SUSE (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm64' || 'ubuntu-latest' }}
    if: inputs.linux_suse != 'skip'
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.linux_suse == 'both' && '["x64", "arm64"]' || inputs.linux_suse == 'x64' && '["x64"]' || '["arm64"]') }}
    container:
      image: opensuse/tumbleweed:latest

    steps:
    - name: Install dependencies
      run: |
        zypper refresh
        zypper install -y gcc gcc-c++ git cmake ninja file \
          libXrandr-devel libXinerama-devel libXcursor-devel libXi-devel \
          Mesa-libGL-devel libGLU1 freetype2-devel fontconfig-devel rpm-build

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure and Build
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja -DCPACK_PACKAGE_VERSION=${{ inputs.version }}
        cmake --build build --config Release -j $(nproc)

    - name: Package (TGZ fallback)
      run: |
        mkdir -p artifact
        cp build/structuracost artifact/
        [ -d "assets" ] && cp -r assets artifact/
        ARCH_NAME="${{ matrix.arch }}"; [ "$ARCH_NAME" = "x64" ] && ARCH_NAME="x86_64"
        cd artifact && tar -czf ../structuracost-linux-suse-${ARCH_NAME}-${{ inputs.version }}.tar.gz * && cd ..

    - name: Build RPM installer via CPack (SUSE)
      run: |
        cmake -B build -DCPACK_GENERATOR=RPM -DCPACK_PACKAGE_VERSION=${{ inputs.version }}
        cmake --build build --target package
        ls -1 build | grep -E '\.rpm$' || true

    - name: Collect SUSE RPM installer
      run: |
        mkdir -p installers
        find build -maxdepth 1 -type f -name "*.rpm" -exec cp {} installers/ \; || true
        ARCH_NAME="${{ matrix.arch }}"; [ "$ARCH_NAME" = "x64" ] && ARCH_NAME="x86_64"
        if ls installers/*.rpm 1> /dev/null 2>&1; then
          for f in installers/*.rpm; do mv "$f" installers/structuracost-linux-suse-${ARCH_NAME}-${{ inputs.version }}.rpm; done
        fi

    - name: Upload SUSE artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-suse-${{ matrix.arch }}
        path: |
          installers/structuracost-linux-suse-${{ matrix.arch == 'x64' && 'x86_64' || matrix.arch }}-${{ inputs.version }}.rpm
        retention-days: 7

    - name: Upload SUSE archive (separate)
      uses: actions/upload-artifact@v4
      with:
        name: linux-suse-${{ matrix.arch }}-archive
        path: structuracost-linux-suse-${{ matrix.arch == 'x64' && 'x86_64' || matrix.arch }}-${{ inputs.version }}.tar.gz
        retention-days: 7

  build-macos:
    name: macOS (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    if: inputs.macos != 'skip'
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.macos == 'both' && '[{"target":"arm64","runner":"macos-14","deployment":"14.0"},{"target":"intel","runner":"macos-13","deployment":"11.0"}]' || inputs.macos == 'arm64' && '[{"target":"arm64","runner":"macos-14","deployment":"14.0"}]' || '[{"target":"intel","runner":"macos-13","deployment":"11.0"}]') }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        brew install cmake ninja freetype

    - name: Configure and Build
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.deployment }} \
          ${{ matrix.target == 'intel' && '-DCMAKE_OSX_ARCHITECTURES=x86_64' || '' }} \
          -DCPACK_PACKAGE_VERSION=${{ inputs.version }} \
          -DCPACK_GENERATOR="DragNDrop;productbuild" \
          -G Ninja
        cmake --build build --config Release -j $(sysctl -n hw.ncpu)

    - name: Make TGZ package (fallback)
      run: |
        cd build
        tar -czf ../structuracost-macos-${{ matrix.target }}-${{ inputs.version }}.tar.gz structuracost.app

    - name: Build installers via CPack (DMG + PKG)
      run: |
        cmake --build build --target package
        ls -1 build | grep -E '\.(dmg|pkg)$' || true

    - name: Collect macOS installers
      run: |
        mkdir -p installers
        find build -maxdepth 1 -type f -name "*.dmg" -exec cp {} installers/ \; || true
        find build -maxdepth 1 -type f -name "*.pkg" -exec cp {} installers/ \; || true
        if ls installers/*.dmg 1> /dev/null 2>&1; then
          mv installers/*.dmg installers/structuracost-macos-${{ matrix.target }}-${{ inputs.version }}.dmg
        fi
        if ls installers/*.pkg 1> /dev/null 2>&1; then
          mv installers/*.pkg installers/structuracost-macos-${{ matrix.target }}-${{ inputs.version }}.pkg
        fi

    - name: Upload macOS installers
      uses: actions/upload-artifact@v4
      with:
        name: macos-${{ matrix.target }}
        path: |
          installers/structuracost-macos-${{ matrix.target }}-${{ inputs.version }}.dmg
          installers/structuracost-macos-${{ matrix.target }}-${{ inputs.version }}.pkg
        retention-days: 7

    - name: Upload macOS archive (separate)
      uses: actions/upload-artifact@v4
      with:
        name: macos-${{ matrix.target }}-archive
        path: structuracost-macos-${{ matrix.target }}-${{ inputs.version }}.tar.gz
        retention-days: 7

  build-windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    if: inputs.windows != 'skip'
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.windows == 'both' && '["x64", "arm64"]' || inputs.windows == 'x64' && '["x64"]' || '["arm64"]') }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install tools
      shell: pwsh
      run: |
        choco install ninja nsis wixtoolset -y
        ninja --version
        # Try to verify NSIS and WiX; non-fatal if not available (e.g., ARM64 compatibility issues)
        try { makensis /VERSION } catch { Write-Host "NSIS may not be available on this platform" }
        try { candle.exe -? | Out-Null } catch { Write-Host "WiX may not be available on this platform" }

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}

    - name: Configure and Build
      shell: pwsh
      run: |
        cmake -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -G Ninja `
          -DCPACK_PACKAGE_VERSION=${{ inputs.version }} `
          -DCPACK_GENERATOR="NSIS;WIX" `
          ${{ matrix.arch == 'arm64' && '-DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=ARM64' || '' }}
        cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS

    - name: Make ZIP package (fallback)
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifact | Out-Null
        $exe = Get-ChildItem -Recurse build -Filter "structuracost.exe" | Select-Object -First 1
        Copy-Item $exe.FullName artifact/
        if (Test-Path assets) { Copy-Item -Recurse assets artifact/ }
        $archName = "${{ matrix.arch }}" -eq "x64" ? "x86_64" : "${{ matrix.arch }}"
        Compress-Archive -Path artifact/* -DestinationPath "structuracost-windows-$archName-${{ inputs.version }}.zip"

    - name: Build installers via CPack (NSIS EXE + WiX MSI)
      shell: pwsh
      run: |
        # Try building installers; may fail on ARM64 due to limited toolchain support
        try {
          cmake --build build --target package
          Get-ChildItem build -Recurse -Filter *.exe | Select-Object -First 10 | ForEach-Object { $_.FullName }
          Get-ChildItem build -Recurse -Filter *.msi | Select-Object -First 10 | ForEach-Object { $_.FullName }
        } catch {
          Write-Host "Warning: Installer generation may have failed. Fallback ZIP will still be available."
        }

    - name: Collect Windows installers
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path installers | Out-Null
        $archName = "${{ matrix.arch }}" -eq "x64" ? "x86_64" : "${{ matrix.arch }}"
        # Collect NSIS exe if available
        $nsis = Get-ChildItem build -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "structuracost|Setup|Installer" } | Select-Object -First 1
        if ($nsis) { 
          Copy-Item $nsis.FullName "installers/structuracost-windows-$archName-${{ inputs.version }}.exe"
          Write-Host "NSIS installer created: structuracost-windows-$archName-${{ inputs.version }}.exe"
        } else {
          Write-Host "Warning: NSIS installer not found (may not be supported on ${{ matrix.arch }})"
        }
        # Collect WiX msi if available
        $msi = Get-ChildItem build -Recurse -Filter "*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($msi) { 
          Copy-Item $msi.FullName "installers/structuracost-windows-$archName-${{ inputs.version }}.msi"
          Write-Host "WiX installer created: structuracost-windows-$archName-${{ inputs.version }}.msi"
        } else {
          Write-Host "Warning: WiX installer not found (may not be supported on ${{ matrix.arch }})"
        }

    - name: Upload Windows installers
      uses: actions/upload-artifact@v4
      with:
        name: windows-${{ matrix.arch }}
        path: |
          installers/*.exe
          installers/*.msi
        retention-days: 7
        if-no-files-found: warn

    - name: Upload Windows archive (separate)
      uses: actions/upload-artifact@v4
      with:
        name: windows-${{ matrix.arch }}-archive
        path: structuracost-windows-${{ matrix.arch == 'x64' && 'x86_64' || matrix.arch }}-${{ inputs.version }}.zip
        retention-days: 7

  create-release:
    name: Create Release
    needs: [build-linux-debian, build-linux-rpm, build-linux-suse, build-macos, build-windows]
    if: |
      always() &&
      needs.build-linux-debian.result != 'failure' && needs.build-linux-debian.result != 'cancelled' &&
      needs.build-linux-rpm.result != 'failure' && needs.build-linux-rpm.result != 'cancelled' &&
      needs.build-linux-suse.result != 'failure' && needs.build-linux-suse.result != 'cancelled' &&
      needs.build-macos.result != 'failure' && needs.build-macos.result != 'cancelled' &&
      needs.build-windows.result != 'failure' && needs.build-windows.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display structure
      run: ls -R artifacts

    - name: Prepare release assets
      run: |
        mkdir release-assets
        
        # Collect all installers
        find artifacts -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.dmg" -o -name "*.pkg" -o -name "*.msi" -o -name "*.exe" \) -exec cp {} release-assets/ \;
        
        # Collect all archives (from -archive artifacts)
        find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;
        
        echo "=== Release Assets ==="
        ls -lh release-assets/
        echo ""
        echo "=== Archive Files ==="
        ls -lh release-assets/*.tar.gz release-assets/*.zip 2>/dev/null || echo "Note: Some archive types may not be present"
        echo ""
        echo "=== Installer Files ==="
        ls -lh release-assets/*.{deb,rpm,dmg,pkg,msi,exe} 2>/dev/null || echo "Note: Some installer types may not be present"

    - name: Checkout repository for release template
      uses: actions/checkout@v4
      with:
        path: repo

    - name: Prepare release notes
      run: |
        cat repo/.github/RELEASE_TEMPLATE.md > release-notes.md
        echo "" >> release-notes.md
        echo "**Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ inputs.version }}" >> release-notes.md

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ inputs.version }}
        name: ${{ inputs.version }}
        draft: false
        prerelease: ${{ inputs.prerelease }}
        generate_release_notes: true
        body_path: release-notes.md
        files: release-assets/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
