name: Release

env:
  CMAKE_BUILD_TYPE: Release
  FORCE_RELEASE_BUILD: "TRUE"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run Mode'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'test'
      version_w:
        description: 'Major Version'
        required: true
        default: 0
        type: number
      version_x:
        description: 'Development Stage'
        required: true
        default: 'stable'
        type: choice
        options:
          - 'pre-alpha'
          - 'alpha'
          - 'beta'
          - 'rc'
          - 'stable'
      version_y:
        description: 'Minor Version'
        required: true
        default: 0
        type: number
      version_z:
        description: 'Patch/Bug Fix Version'
        required: true
        default: 0
        type: number
      stage_iteration:
        description: 'Stage Build Number (e.g., 1, 2, 3 for -beta.1, -beta.2, etc.)'
        required: false
        default: 0
        type: number
      macos:
        description: 'macOS'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'arm64'
          - 'intel'
          - 'skip'
      windows:
        description: 'Windows'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'x64'
          - 'arm64'
          - 'skip'

jobs:
  prepare-version:
    name: Prepare Version
    runs-on: macos-15
    outputs:
      version_numeric: ${{ steps.version.outputs.version_numeric }}
      stage_suffix: ${{ steps.version.outputs.stage_suffix }}
      combined_version: ${{ steps.version.outputs.combined_version }}
    steps:
    - name: Compute full version
      id: version
      shell: bash
      run: |
        W="${{ inputs.version_w }}"
        X_NAME="${{ inputs.version_x }}"   # pre-alpha | alpha | beta | rc | stable
        Y="${{ inputs.version_y }}"
        Z="${{ inputs.version_z }}"
        ITERATION="${{ inputs.stage_iteration }}"

        # Map stage name to numeric X and textual suffix/label
        case "$X_NAME" in
          stable)
            X_NUM=4; STAGE_SUFFIX=""; STAGE_LABEL="Stable" ;;
          rc)
            X_NUM=3; STAGE_SUFFIX="-rc"; STAGE_LABEL="RC" ;;
          beta)
            X_NUM=2; STAGE_SUFFIX="-beta"; STAGE_LABEL="Beta" ;;
          alpha)
            X_NUM=1; STAGE_SUFFIX="-alpha"; STAGE_LABEL="Alpha" ;;
          pre-alpha)
            X_NUM=0; STAGE_SUFFIX="-pre-alpha"; STAGE_LABEL="Pre-Alpha" ;;
          *)
            echo "Unknown stage '$X_NAME'" >&2; exit 1 ;;
        esac

        # Append iteration number if provided (e.g., -beta.1, -pre-alpha.2)
        # Only append for non-stable releases and when iteration > 0
        if [ "$ITERATION" -gt 0 ] && [ "$X_NAME" != "stable" ]; then
          STAGE_SUFFIX="${STAGE_SUFFIX}.${ITERATION}"
        fi

        VERSION_NUMERIC="v${W}.${X_NUM}.${Y}.${Z}"
        COMBINED_VERSION="${VERSION_NUMERIC}${STAGE_SUFFIX}"
        echo "version_numeric=${VERSION_NUMERIC}"   >> "$GITHUB_OUTPUT"
        echo "stage_suffix=${STAGE_SUFFIX}"         >> "$GITHUB_OUTPUT"
        echo "combined_version=${COMBINED_VERSION}" >> "$GITHUB_OUTPUT"
        echo "Computed: ${COMBINED_VERSION}"

  build-macos:
    name: macOS (${{ matrix.target }})
    needs: prepare-version
    runs-on: ${{ matrix.runner }}
    if: inputs.macos != 'skip'
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.macos == 'both' && '[{"target":"arm64","runner":"macos-15","deployment":"14.0"},{"target":"intel","runner":"macos-15-intel","deployment":"11.0"}]' || inputs.macos == 'arm64' && '[{"target":"arm64","runner":"macos-15","deployment":"14.0"}]' || '[{"target":"intel","runner":"macos-15-intel","deployment":"11.0"}]') }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        brew install cmake ninja freetype libsodium

    - name: Verify libsodium
      run: |
        test -f /opt/homebrew/include/sodium.h || test -f /usr/local/include/sodium.h || (echo "libsodium header missing"; exit 1)

    - name: Configure and Build
      run: |
        VERSION="${{ needs.prepare-version.outputs.version_numeric }}"
        VERSION="${VERSION#v}"
        
        ARCH_FLAG=""
        [ "${{ matrix.target }}" = "intel" ] && ARCH_FLAG="-DCMAKE_OSX_ARCHITECTURES=x86_64"

        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" \
          -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.deployment }} \
          ${ARCH_FLAG} \
          -DCPACK_PACKAGE_VERSION="${VERSION}" \
          -DCPACK_GENERATOR="DragNDrop;productbuild"
        
        cmake --build build --config Release -j $(sysctl -n hw.ncpu)
        cmake --install build --config Release --prefix "${PWD}/build/ci_temp_install/structuracost"

    - name: Build installers via CPack (DMG + PKG)
      run: |
        cmake --build build --target package
        ls -1 build | grep -E '\.(dmg|pkg)$' || true

    - name: Collect macOS installers
      run: |
        mkdir -p installers
        find build -maxdepth 1 -type f -name "*.dmg" -exec cp {} installers/ \; || true
        find build -maxdepth 1 -type f -name "*.pkg" -exec cp {} installers/ \; || true
        if ls installers/*.dmg 1> /dev/null 2>&1; then
          mv installers/*.dmg installers/structuracost-macos-${{ matrix.target }}-${{ needs.prepare-version.outputs.combined_version }}.dmg
        fi
        if ls installers/*.pkg 1> /dev/null 2>&1; then
          mv installers/*.pkg installers/structuracost-macos-${{ matrix.target }}-${{ needs.prepare-version.outputs.combined_version }}.pkg
        fi

    - name: Upload macOS installers
      uses: actions/upload-artifact@v4
      with:
        name: macos-${{ matrix.target }}
        path: |
          installers/structuracost-macos-${{ matrix.target }}-${{ needs.prepare-version.outputs.combined_version }}.dmg
          installers/structuracost-macos-${{ matrix.target }}-${{ needs.prepare-version.outputs.combined_version }}.pkg
        retention-days: 7

    - name: Upload macOS archive (separate)
      uses: actions/upload-artifact@v4
      with:
        name: macos-${{ matrix.target }}-archive
        path: structuracost-macos-${{ matrix.target }}-${{ needs.prepare-version.outputs.combined_version }}.tar.gz
        retention-days: 7

  build-windows:
    name: Windows (${{ matrix.arch }})
    needs: prepare-version
    runs-on: windows-latest
    if: inputs.windows != 'skip'
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.windows == 'both' && '["x64", "arm64"]' || inputs.windows == 'x64' && '["x64"]' || '["arm64"]') }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install libsodium
      shell: pwsh
      run: |
        Write-Host "=== Installing libsodium (arch-aware) ==="
        $url = "https://download.libsodium.org/libsodium/releases/libsodium-1.0.20-stable-msvc.zip"
        $zipFile = "$env:TEMP\libsodium.zip"
        $extractPath = "${{ github.workspace }}\dependencies\libsodium"
        New-Item -ItemType Directory -Force -Path $extractPath | Out-Null
        Invoke-WebRequest -Uri $url -OutFile $zipFile
        Expand-Archive -Path $zipFile -DestinationPath $extractPath -Force

        # Handle nested 'libsodium' folder from archive
        $root = $extractPath
        if (Test-Path "$extractPath\libsodium") { $root = "$extractPath\libsodium" }

        # Ensure include directory present
        if (-not (Test-Path "$extractPath\include\sodium.h")) {
          $includeSrc = Get-ChildItem -Path $root -Recurse -Directory -Filter "include" | Select-Object -First 1
          if ($includeSrc) {
            $dest = Join-Path $extractPath "include"
            $destPath = (Resolve-Path -LiteralPath $dest -ErrorAction SilentlyContinue).Path
            if (-not $destPath -or ($includeSrc.FullName -ne $destPath)) {
              Copy-Item -Path $includeSrc.FullName -Destination $dest -Recurse -Force
            }
          }
        }

        $arch = "${{ matrix.arch }}"
        Write-Host "Target architecture: $arch"

        # Gather candidate libs filtered by architecture
        $candidates = @()
        Get-ChildItem -Path $root -Recurse -Include "libsodium.lib","libsodium.a" | ForEach-Object {
          $p = $_.FullName
          if ($arch -eq "x64") {
            if ($p -match "x64|x86_64|Win64" -and $p -notmatch "ARM64") { $candidates += $p }
          } else {
            if ($p -match "ARM64" -and $p -notmatch "x64|x86_64") { $candidates += $p }
          }
        }

        if ($candidates.Count -eq 0) {
          Write-Host "No architecture-filtered libs found; using first found libsodium.* if any"
          $fallback = Get-ChildItem -Path $root -Recurse -Include "libsodium.lib","libsodium.a" | Select-Object -First 1
          if ($fallback) { $candidates += $fallback.FullName }
        }

        if ($candidates.Count -gt 0) {
          $libPick = $candidates[0]
          "SODIUM_LIBRARY_FILE=$libPick" >> $env:GITHUB_ENV
          Write-Host "Selected libsodium library: $libPick"
        } else {
          Write-Host "WARNING: libsodium library not found; build may fail"
        }

        $header = Get-ChildItem -Path $extractPath -Recurse -Filter "sodium.h" | Select-Object -First 1
        if ($header) {
          $incDir = Split-Path -Parent $header.FullName
          "SODIUM_INCLUDE_DIR=$incDir" >> $env:GITHUB_ENV
          Write-Host "Include dir: $incDir"
        } else {
          Write-Host "ERROR: sodium.h not found"; exit 1
        }

        Write-Host "=== libsodium install complete ==="

    - name: Verify libsodium
      shell: pwsh
      run: |
        Write-Host "=== Verifying libsodium ==="
        if (-not $env:SODIUM_INCLUDE_DIR -or -not (Test-Path "$env:SODIUM_INCLUDE_DIR\sodium.h")) {
          Write-Host "libsodium header missing"; exit 1
        }
        Write-Host "Header OK: $env:SODIUM_INCLUDE_DIR\sodium.h"
        if ($env:SODIUM_LIBRARY_FILE -and (Test-Path $env:SODIUM_LIBRARY_FILE)) {
          Write-Host "Library OK: $env:SODIUM_LIBRARY_FILE"
        } else {
          Write-Host "Library not set (may attempt dynamic linkage)"
        }
        Write-Host "Verification complete"

    - name: Install tools
      shell: pwsh
      run: |
        choco install ninja nsis -y
        ninja --version
        try { makensis /VERSION } catch { Write-Host "NSIS may not be available on this platform" }

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}

    - name: Configure and Build
      shell: pwsh
      run: |
        $version = "${{ needs.prepare-version.outputs.version_numeric }}" -replace '^v', ''
        
        $cmakeArgs = @(
          '-B', 'build', '-G', 'Ninja'
          '-DCMAKE_BUILD_TYPE=Release'
          '-DCMAKE_C_FLAGS_RELEASE=/O2 /MD /DNDEBUG'
          '-DCMAKE_CXX_FLAGS_RELEASE=/O2 /MD /DNDEBUG'
          '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL'
          "-DCPACK_PACKAGE_VERSION=$version"
          '-DCPACK_GENERATOR=NSIS'
        )
        
        if ($env:SODIUM_INCLUDE_DIR) {
          $cmakeArgs += "-DSODIUM_INCLUDE_DIR=$env:SODIUM_INCLUDE_DIR"
        }
        if ($env:SODIUM_LIBRARY_FILE) {
          $cmakeArgs += "-DSODIUM_LIBRARY=$env:SODIUM_LIBRARY_FILE"
        }
        
        if ('${{ matrix.arch }}' -eq 'arm64') {
          $cmakeArgs += '-DCMAKE_SYSTEM_NAME=Windows', '-DCMAKE_SYSTEM_PROCESSOR=ARM64'
        }
        
        & cmake @cmakeArgs
        if ($LASTEXITCODE -ne 0) { exit 1 }
        
        cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS
        
        $staging = Join-Path $PWD 'build\ci_temp_install\structuracost'
        New-Item -ItemType Directory -Force -Path $staging | Out-Null
        & cmake --install build --config Release --prefix $staging

    - name: Build NSIS installer via CPack
      shell: pwsh
      run: |
        pushd build
        & cpack -G NSIS -C Release --verbose
        if ($LASTEXITCODE -ne 0) {
          if (Test-Path "_CPack_Packages/win64/NSIS/NSISOutput.log") {
            Get-Content "_CPack_Packages/win64/NSIS/NSISOutput.log"
          }
          exit $LASTEXITCODE
        }
        popd

    - name: Upload Windows installer
      uses: actions/upload-artifact@v4
      with:
        name: windows-${{ matrix.arch }}
        path: build/output/*.exe
        retention-days: 7



  create-release:
    name: Create Release
    needs: [prepare-version, build-macos, build-windows]
    if: |
      inputs.mode == 'release' &&
      always() &&
      needs.build-macos.result != 'failure' && needs.build-macos.result != 'cancelled' &&
      needs.build-windows.result != 'failure' && needs.build-windows.result != 'cancelled'
    runs-on: macos-15
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display structure
      run: ls -R artifacts

    - name: Prepare release assets
      run: |
        mkdir release-assets

        # Collect all installers
        find artifacts -type f \( -name "*.dmg" -o -name "*.pkg" -o -name "*.exe" \) -exec cp {} release-assets/ \;

        # Collect all archives (from -archive artifacts)
        find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;

        echo "=== Release Assets ==="
        ls -lh release-assets/
        echo ""
        echo "=== Archive Files ==="
        ls -lh release-assets/*.tar.gz release-assets/*.zip 2>/dev/null || echo "Note: Some archive types may not be present"
        echo ""
        echo "=== Installer Files ==="
        ls -lh release-assets/*.{dmg,pkg,exe} 2>/dev/null || echo "Note: Some installer types may not be present"

    - name: Checkout repository for CHANGELOG
      uses: actions/checkout@v4
      with:
        path: repo

    - name: Prepare release notes
      run: |
        # Add release type badge at the top with color-coded highlighting based on X (named stage)
        case "${{ inputs.version_x }}" in
          stable)
            echo "## 🚀 Stable Release" > release-notes.md ;;
          rc)
            echo "## 🔄 Release Candidate" > release-notes.md ;;
          beta)
            echo "## 🧪 Beta Release" > release-notes.md ;;
          alpha)
            echo "## ⚠️ Alpha Release" > release-notes.md ;;
          pre-alpha)
            echo "## 🛠️ Pre-Alpha Release" > release-notes.md ;;
        esac
        echo "" >> release-notes.md

        # Add highlighted warning boxes for pre-release types
        case "${{ inputs.version_x }}" in
          rc)
            echo "> [!WARNING]" >> release-notes.md
            echo "> **Release Candidate:** This is a release candidate. Final testing before stable release." >> release-notes.md
            echo "" >> release-notes.md ;;
          beta)
            echo "> [!CAUTION]" >> release-notes.md
            echo "> **Beta Release:** This release may contain bugs and is not recommended for production use." >> release-notes.md
            echo "" >> release-notes.md ;;
          alpha)
            echo "> [!CAUTION]" >> release-notes.md
            echo "> **Alpha Release:** This is an unstable alpha release. Intended for testing purposes only. Do not use in production!" >> release-notes.md
            echo "" >> release-notes.md ;;
          pre-alpha)
            echo "> [!INFO]" >> release-notes.md
            echo "> **Pre-Alpha Release:** This is a pre-alpha release. It may be unstable and is intended for testing and feedback." >> release-notes.md
            echo "" >> release-notes.md ;;
        esac

        # Use CHANGELOG.md as the main release content
        if [ -f "repo/CHANGELOG.md" ]; then
          cat repo/CHANGELOG.md >> release-notes.md
        else
          echo "**No changelog available for this release.**" >> release-notes.md
        fi
        echo "" >> release-notes.md
        echo "---" >> release-notes.md
        echo "" >> release-notes.md
        echo "**Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ needs.prepare-version.outputs.combined_version }}" >> release-notes.md

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ needs.prepare-version.outputs.combined_version }}
        name: "${{ needs.prepare-version.outputs.combined_version }}"
        draft: false
        prerelease: ${{ inputs.version_x != 'stable' }}
        generate_release_notes: true
        body_path: release-notes.md
        files: "release-assets/*"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-summary:
    name: Test Build Summary
    needs: [prepare-version, build-macos, build-windows]
    if: |
      inputs.mode == 'test' &&
      always()
    runs-on: macos-15

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Aggregate artifacts
      run: |
        echo "Creating aggregated artifact directory (test mode)"
        mkdir -p release-assets
        # Copy all installer and archive files into release-assets for easy browsing
        find artifacts -type f \( -name "*.dmg" -o -name "*.pkg" -o -name "*.exe" -o -name "*.zip" \) -exec cp {} release-assets/ \; || true
        echo "Listing aggregated artifacts";
        ls -lh release-assets || echo "No artifacts copied"

    - name: Display test build summary
      run: |
        echo "=============================================="
        echo "🧪 TEST MODE - Build Summary"
        echo "=============================================="
        echo "Version: ${{ needs.prepare-version.outputs.combined_version }}"
        echo "Mode: TEST (no GitHub release will be created)"
        echo ""
        echo "Build Results:"
        echo "  macOS:        ${{ needs.build-macos.result }}"
        echo "  Windows:      ${{ needs.build-windows.result }}"
        echo ""
        echo "=============================================="
        echo "Artifacts (raw download structure):"
        echo "=============================================="
        ls -R artifacts || true
        echo ""
        echo "=============================================="
        echo "Aggregated Artifacts (release-assets):"
        echo "=============================================="
        ls -lh release-assets || true
        echo ""
        echo "Installer files (if present):"
        ls -lh release-assets/*.{dmg,pkg,exe} 2>/dev/null || echo "(none)"
        echo ""
        echo "Archive files (if present):"
        ls -lh release-assets/*.{tar.gz,zip} 2>/dev/null || echo "(none)"
        echo ""
        echo "=============================================="
        echo "✅ Test build complete. To publish, rerun with mode='release'."
        echo "=============================================="

