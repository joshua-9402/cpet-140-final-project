name: Create Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean
      linux_debian:
        description: 'Linux Debian/Ubuntu'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'x64'
          - 'arm64'
          - 'skip'
      linux_rpm:
        description: 'Linux Fedora/Red Hat'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'x64'
          - 'arm64'
          - 'skip'
      linux_suse:
        description: 'Linux SUSE'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'x64'
          - 'arm64'
          - 'skip'
      macos:
        description: 'macOS'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'arm64'
          - 'intel'
          - 'skip'
      windows:
        description: 'Windows'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'x64'
          - 'arm64'
          - 'skip'

jobs:
  # Linux Debian/Ubuntu builds
  build-linux-debian:
    name: Linux Debian/Ubuntu (${{ matrix.distribution }}-${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm64' || 'ubuntu-latest' }}
    if: inputs.linux_debian != 'skip'
    strategy:
      matrix:
        distribution: [ubuntu-22.04]
        arch: ${{ fromJSON(inputs.linux_debian == 'both' && '["x64", "arm64"]' || inputs.linux_debian == 'x64' && '["x64"]' || '["arm64"]') }}
    container:
      image: ubuntu:22.04

    steps:
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y build-essential git cmake ninja-build file libglfw3-dev \
          libwayland-dev wayland-protocols \
          libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev \
          libglu1-mesa-dev libfreetype6-dev libfontconfig1-dev pkg-config

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure and Build
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
        cmake --build build --config Release -j $(nproc)

    - name: Package
      run: |
        mkdir -p artifact
        cp build/payroll-and-monitoring-system artifact/
        [ -d "assets" ] && cp -r assets artifact/
        cd artifact && tar -czf ../payroll-and-monitoring-system-${{ matrix.distribution }}-${{ matrix.arch }}-Release.tar.gz * && cd ..

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-debian-${{ matrix.distribution }}-${{ matrix.arch }}
        path: payroll-and-monitoring-system-${{ matrix.distribution }}-${{ matrix.arch }}-Release.tar.gz
        retention-days: 1

  # Linux Fedora/Red Hat builds
  build-linux-rpm:
    name: Linux RPM (${{ matrix.distribution }}-${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm64' || 'ubuntu-latest' }}
    if: inputs.linux_rpm != 'skip'
    strategy:
      matrix:
        distribution: [fedora-latest]
        arch: ${{ fromJSON(inputs.linux_rpm == 'both' && '["x64", "arm64"]' || inputs.linux_rpm == 'x64' && '["x64"]' || '["arm64"]') }}
    container:
      image: fedora:latest

    steps:
    - name: Install dependencies
      run: |
        dnf install -y gcc gcc-c++ git cmake ninja-build file glfw-devel \
          wayland-devel wayland-protocols-devel \
          libXrandr-devel libXinerama-devel libXcursor-devel libXi-devel \
          mesa-libGL-devel mesa-libGLU-devel freetype-devel fontconfig-devel pkg-config

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure and Build
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
        cmake --build build --config Release -j $(nproc)

    - name: Package
      run: |
        mkdir -p artifact
        cp build/payroll-and-monitoring-system artifact/
        [ -d "assets" ] && cp -r assets artifact/
        cd artifact && tar -czf ../payroll-and-monitoring-system-${{ matrix.distribution }}-${{ matrix.arch }}-Release.tar.gz * && cd ..

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-rpm-${{ matrix.distribution }}-${{ matrix.arch }}
        path: payroll-and-monitoring-system-${{ matrix.distribution }}-${{ matrix.arch }}-Release.tar.gz
        retention-days: 1

  # Linux SUSE builds
  build-linux-suse:
    name: Linux SUSE (${{ matrix.distribution }}-${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm64' || 'ubuntu-latest' }}
    if: inputs.linux_suse != 'skip'
    strategy:
      matrix:
        distribution: [opensuse-tumbleweed]
        arch: ${{ fromJSON(inputs.linux_suse == 'both' && '["x64", "arm64"]' || inputs.linux_suse == 'x64' && '["x64"]' || '["arm64"]') }}
    container:
      image: opensuse/tumbleweed:latest

    steps:
    - name: Install dependencies
      run: |
        zypper refresh
        zypper install -y gcc gcc-c++ git cmake ninja file \
          libXrandr-devel libXinerama-devel libXcursor-devel libXi-devel \
          Mesa-libGL-devel libGLU1 freetype2-devel fontconfig-devel

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure and Build
      run: |
        # Let HelloImGui use its bundled GLFW instead of system GLFW
        cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
        cmake --build build --config Release -j $(nproc)

    - name: Package
      run: |
        mkdir -p artifact
        cp build/payroll-and-monitoring-system artifact/
        [ -d "assets" ] && cp -r assets artifact/
        cd artifact && tar -czf ../payroll-and-monitoring-system-${{ matrix.distribution }}-${{ matrix.arch }}-Release.tar.gz * && cd ..

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-suse-${{ matrix.distribution }}-${{ matrix.arch }}
        path: payroll-and-monitoring-system-${{ matrix.distribution }}-${{ matrix.arch }}-Release.tar.gz
        retention-days: 1

  # macOS builds
  build-macos:
    name: macOS (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    if: inputs.macos != 'skip'
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.macos == 'both' && '[{"target":"arm64","runner":"macos-14","deployment":"14.0"},{"target":"intel","runner":"macos-13","deployment":"11.0"}]' || inputs.macos == 'arm64' && '[{"target":"arm64","runner":"macos-14","deployment":"14.0"}]' || '[{"target":"intel","runner":"macos-13","deployment":"11.0"}]') }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        brew install cmake ninja freetype

    - name: Configure and Build
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.deployment }} \
          ${{ matrix.target == 'intel' && '-DCMAKE_OSX_ARCHITECTURES=x86_64' || '' }} \
          -G Ninja
        cmake --build build --config Release -j $(sysctl -n hw.ncpu)

    - name: Package
      run: |
        cd build
        tar -czf ../payroll-and-monitoring-system-macos-${{ matrix.target }}-Release.tar.gz payroll-and-monitoring-system.app

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-${{ matrix.target }}
        path: payroll-and-monitoring-system-macos-${{ matrix.target }}-Release.tar.gz
        retention-days: 1

  # Windows builds
  build-windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    if: inputs.windows != 'skip'
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.windows == 'both' && '["x64", "arm64"]' || inputs.windows == 'x64' && '["x64"]' || '["arm64"]') }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Ninja
      shell: pwsh
      run: |
        choco install ninja -y
        ninja --version

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}

    - name: Configure and Build
      shell: pwsh
      run: |
        cmake -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -G Ninja `
          ${{ matrix.arch == 'arm64' && '-DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=ARM64' || '' }}
        cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS

    - name: Package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifact
        $exe = Get-ChildItem -Recurse build -Filter "payroll-and-monitoring-system.exe" | Select-Object -First 1
        Copy-Item $exe.FullName artifact/
        if (Test-Path assets) { Copy-Item -Recurse assets artifact/ }
        Compress-Archive -Path artifact/* -DestinationPath "payroll-and-monitoring-system-windows-${{ matrix.arch }}-Release.zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-${{ matrix.arch }}
        path: payroll-and-monitoring-system-windows-${{ matrix.arch }}-Release.zip
        retention-days: 1

  # Create GitHub Release
  create-release:
    name: Create Release
    needs: [build-linux-debian, build-linux-rpm, build-linux-suse, build-macos, build-windows]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display structure
      run: ls -R artifacts

    - name: Prepare release assets
      run: |
        mkdir release-assets
        find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;
        ls -lh release-assets/

    - name: Checkout repository for release template
      uses: actions/checkout@v4
      with:
        path: repo

    - name: Prepare release notes
      run: |
        # Read the release template
        cat repo/.github/RELEASE_TEMPLATE.md > release-notes.md
        
        # Add Full Changelog link
        echo "" >> release-notes.md
        echo "**Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ inputs.version }}" >> release-notes.md

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ inputs.version }}
        name: ${{ inputs.version }}
        draft: false
        prerelease: ${{ inputs.prerelease }}
        generate_release_notes: true
        body_path: release-notes.md
        files: release-assets/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

