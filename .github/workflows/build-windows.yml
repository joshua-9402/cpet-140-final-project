name: Windows

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Target Architecture'
        required: true
        default: 'x64'
        type: choice
        options:
          - x64
          - arm64
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      enable_lto:
        description: 'Enable Link-Time Optimization'
        required: false
        default: true
        type: boolean

jobs:
  build-windows:
    name: Windows (${{ inputs.architecture }})
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install libsodium
      shell: pwsh
      run: |
        Write-Host "=== Installing libsodium ==="
        
        # Download libsodium prebuilt binary for Windows
        $url = "https://download.libsodium.org/libsodium/releases/libsodium-1.0.20-stable-msvc.zip"
        $zipFile = "$env:TEMP\libsodium.zip"
        $extractPath = "${{ github.workspace }}\dependencies\libsodium"
        
        Write-Host "Downloading libsodium from $url"
        Invoke-WebRequest -Uri $url -OutFile $zipFile
        
        Write-Host "Extracting to $extractPath"
        Expand-Archive -Path $zipFile -DestinationPath $extractPath -Force
        
        # The zip contains architecture-specific folders, we need to organize them
        # Structure: libsodium/[x64|Win32|ARM64]/[Release|Debug]/[v142|v143]/[dynamic|static]/
        
        Write-Host "Organizing libsodium files..."
        # Copy include files to a common location
        if (Test-Path "$extractPath\include") {
          Write-Host "✓ Include files already in place"
        } else {
          # Find and copy include directory from the extracted structure
          $includeSrc = Get-ChildItem -Path $extractPath -Recurse -Directory -Filter "include" | Select-Object -First 1
          if ($includeSrc) {
            $dest = Join-Path $extractPath "include"
            $destPath = (Resolve-Path -LiteralPath $dest -ErrorAction SilentlyContinue).Path
            if (-not $destPath -or ($includeSrc.FullName -ne $destPath)) {
              Copy-Item -Path $includeSrc.FullName -Destination $dest -Recurse -Force
              Write-Host "✓ Copied include files"
            } else {
              Write-Host "Include source equals destination, skipping copy"
            }
          }
        }
        
        Write-Host "✓ libsodium installed successfully"
        
        # List the structure for debugging
        Write-Host "`nExtracted structure:"
        Get-ChildItem -Path $extractPath -Recurse -Depth 2 | Select-Object FullName

    - name: System information
      shell: pwsh
      run: |
        Write-Host "=== System Info ==="
        Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture
        Write-Host "`n=== CPU Info ==="
        Get-WmiObject Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors
        Write-Host "`n=== Available Memory ==="
        $memory = Get-WmiObject Win32_OperatingSystem
        Write-Host "Total RAM: $([math]::Round($memory.TotalVisibleMemorySize/1MB, 2)) GB"
        Write-Host "`n=== Target Architecture ==="
        Write-Host "${{ inputs.architecture }}"

    - name: Install Ninja
      shell: pwsh
      run: |
        Write-Host "=== Installing Ninja build system ==="
        choco install ninja -y
        ninja --version

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ inputs.architecture == 'arm64' && 'amd64_arm64' || 'amd64' }}

    - name: Verify MSVC setup
      shell: pwsh
      run: |
        Write-Host "=== Verifying MSVC setup ==="
        cl.exe 2>&1 | Select-String "Compiler Version"
        Write-Host "`n=== CMake version ==="
        cmake --version
        Write-Host "`n=== Ninja version ==="
        ninja --version

    - name: Configure CMake
      shell: pwsh
      run: |
        Write-Host "=== Configuring CMake ==="
        
        $cmakeArgs = @(
          "-B", "build",
          "-DCMAKE_BUILD_TYPE=${{ inputs.build_type }}",
          "-G", "Ninja"
        )
        
        # Add ARM64-specific configuration
        if ("${{ inputs.architecture }}" -eq "arm64") {
          $cmakeArgs += "-DCMAKE_SYSTEM_NAME=Windows"
          $cmakeArgs += "-DCMAKE_SYSTEM_PROCESSOR=ARM64"
        }
        
        # Add LTO flag if disabled
        if ("${{ inputs.enable_lto }}" -eq "false") {
          $cmakeArgs += "-DNO_LTO=ON"
        }
        
        & cmake @cmakeArgs

    - name: Build
      shell: pwsh
      run: |
        Write-Host "=== Building application ==="
        cmake --build build --config ${{ inputs.build_type }} -j $env:NUMBER_OF_PROCESSORS

    - name: Verify build output
      shell: pwsh
      run: |
        Write-Host "=== Checking build output ==="
        Get-ChildItem -Recurse build | Where-Object { $_.Name -like "structuracost.exe" } | ForEach-Object {
          Write-Host "✅ Executable found: $($_.FullName)"
          Write-Host "Size: $([math]::Round($_.Length/1MB, 2)) MB"
        }
        
        if (-not (Test-Path "build\structuracost.exe")) {
          Write-Host "❌ Build output not found!"
          exit 1
        }

    - name: Verify Release Build (Check Runtime Libraries)
      if: inputs.build_type == 'Release'
      shell: pwsh
      run: |
        Write-Host "=== Verifying Release Build ===" -ForegroundColor Cyan
        $exe = Get-ChildItem -Recurse build -Filter "structuracost.exe" | Select-Object -First 1
        
        if ($exe) {
          # Run verification script if it exists
          if (Test-Path "packaging/windows/verify_release_build.ps1") {
            & powershell -ExecutionPolicy Bypass -File "packaging/windows/verify_release_build.ps1" -ExecutablePath $exe.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host ""
              Write-Host "===================================================================" -ForegroundColor Red
              Write-Host "CRITICAL ERROR: Build contains DEBUG runtime dependencies!" -ForegroundColor Red
              Write-Host "This will cause error 0xc000007b on systems without debug DLLs." -ForegroundColor Red
              Write-Host "===================================================================" -ForegroundColor Red
              exit 1
            }
          } else {
            Write-Host "Verification script not found, performing basic check..."
            
            # Basic check
            $dumpbin = Get-Command dumpbin -ErrorAction SilentlyContinue
            if ($dumpbin) {
              $deps = & dumpbin /dependents $exe.FullName 2>&1 | Out-String
              Write-Host "Dependencies:" -ForegroundColor Yellow
              Write-Host $deps
              
              if ($deps -match "ucrtbased\.dll|vcruntime140d\.dll|msvcp140d\.dll") {
                Write-Host ""
                Write-Host "ERROR: Debug runtime DLLs detected in Release build!" -ForegroundColor Red
                exit 1
              } else {
                Write-Host ""
                Write-Host "✓ No debug runtime DLLs detected" -ForegroundColor Green
              }
            } else {
              Write-Host "dumpbin not available, skipping verification"
            }
          }
        }

    - name: Package artifacts
      shell: pwsh
      run: |
        Write-Host "=== Packaging application ==="
        New-Item -ItemType Directory -Force -Path artifact | Out-Null
        
        # Find and copy the executable
        $exe = Get-ChildItem -Recurse build -Filter "structuracost.exe" | Select-Object -First 1
        Copy-Item $exe.FullName artifact\
        
        # Copy assets if they exist
        if (Test-Path assets) {
          Copy-Item -Recurse assets artifact\
        }
        
        # Create ZIP archive
        $archiveName = "structuracost-windows-${{ inputs.architecture }}-${{ inputs.build_type }}.zip"
        Compress-Archive -Path artifact\* -DestinationPath $archiveName
        
        Write-Host "=== Archive created ==="
        Get-Item $archiveName | ForEach-Object {
          Write-Host "Name: $($_.Name)"
          Write-Host "Size: $([math]::Round($_.Length/1MB, 2)) MB"
        }

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: structuracost-windows-${{ inputs.architecture }}-${{ inputs.build_type }}
        path: structuracost-windows-${{ inputs.architecture }}-${{ inputs.build_type }}.zip
        retention-days: 90

    - name: Build summary
      shell: pwsh
      run: |
        $archDesc = if ("${{ inputs.architecture }}" -eq "x64") { "x64 (Intel/AMD 64-bit)" } else { "ARM64 (Snapdragon, Surface Pro X)" }
        
        @"
        ### ✅ Build Completed Successfully
        
        **Architecture:** $archDesc
        **Build Type:** ${{ inputs.build_type }}
        **LTO Enabled:** ${{ inputs.enable_lto }}
        **Compiler:** MSVC $(cl.exe 2>&1 | Select-String "Compiler Version" | Out-String)
        
        **Artifact:** structuracost-windows-${{ inputs.architecture }}-${{ inputs.build_type }}.zip
        
        Download the artifact from the workflow run page.
        "@ | Out-File -Append $env:GITHUB_STEP_SUMMARY

    - name: Set up environment variables for libsodium
      shell: pwsh
      run: |
        Write-Host "Setting environment variables for CMake"
        $inc = Get-ChildItem -Path $extractPath -Recurse -Filter "sodium.h" | Select-Object -First 1 | Split-Path -Parent
        if ($inc) {
          echo "SODIUM_INCLUDE_DIR=$inc" >> $env:GITHUB_ENV
        }
        $lib = Get-ChildItem -Path $extractPath -Recurse -Include "libsodium.lib" | Select-Object -First 1
        if ($lib) {
          echo "SODIUM_LIBRARY_FILE=$($lib.FullName)" >> $env:GITHUB_ENV
        }

    - name: Verify libsodium
      shell: pwsh
      run: |
        Write-Host "=== Verifying libsodium ==="
        if (-not $env:SODIUM_INCLUDE_DIR) { Write-Host "Missing SODIUM_INCLUDE_DIR"; exit 1 }
        if (-not (Test-Path $env:SODIUM_INCLUDE_DIR\sodium.h)) { Write-Host "sodium.h not found"; exit 1 }
        Write-Host "Header OK"
        if (-not $env:SODIUM_LIBRARY_FILE) { Write-Host "libsodium.lib not found (may still link dynamically)"; }
        Write-Host "Verification complete"
