name: Windows

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Target Architecture'
        required: true
        default: 'x64'
        type: choice
        options:
          - x64
          - arm64
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      enable_lto:
        description: 'Enable Link-Time Optimization'
        required: false
        default: true
        type: boolean

jobs:
  build-windows:
    name: Windows (${{ inputs.architecture }})
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: System information
      shell: pwsh
      run: |
        Write-Host "=== System Info ==="
        Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture
        Write-Host "`n=== CPU Info ==="
        Get-WmiObject Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors
        Write-Host "`n=== Available Memory ==="
        $memory = Get-WmiObject Win32_OperatingSystem
        Write-Host "Total RAM: $([math]::Round($memory.TotalVisibleMemorySize/1MB, 2)) GB"
        Write-Host "`n=== Target Architecture ==="
        Write-Host "${{ inputs.architecture }}"

    - name: Install Ninja
      shell: pwsh
      run: |
        Write-Host "=== Installing Ninja build system ==="
        choco install ninja -y
        ninja --version

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ inputs.architecture == 'arm64' && 'amd64_arm64' || 'amd64' }}

    - name: Verify MSVC setup
      shell: pwsh
      run: |
        Write-Host "=== Verifying MSVC setup ==="
        cl.exe 2>&1 | Select-String "Compiler Version"
        Write-Host "`n=== CMake version ==="
        cmake --version
        Write-Host "`n=== Ninja version ==="
        ninja --version

    - name: Configure CMake
      shell: pwsh
      run: |
        Write-Host "=== Configuring CMake ==="
        
        $cmakeArgs = @(
          "-B", "build",
          "-DCMAKE_BUILD_TYPE=${{ inputs.build_type }}",
          "-G", "Ninja"
        )
        
        # Add ARM64-specific configuration
        if ("${{ inputs.architecture }}" -eq "arm64") {
          $cmakeArgs += "-DCMAKE_SYSTEM_NAME=Windows"
          $cmakeArgs += "-DCMAKE_SYSTEM_PROCESSOR=ARM64"
        }
        
        # Add LTO flag if disabled
        if ("${{ inputs.enable_lto }}" -eq "false") {
          $cmakeArgs += "-DNO_LTO=ON"
        }
        
        & cmake @cmakeArgs

    - name: Build
      shell: pwsh
      run: |
        Write-Host "=== Building application ==="
        cmake --build build --config ${{ inputs.build_type }} -j $env:NUMBER_OF_PROCESSORS

    - name: Verify build output
      shell: pwsh
      run: |
        Write-Host "=== Checking build output ==="
        Get-ChildItem -Recurse build | Where-Object { $_.Name -like "payroll-and-monitoring-system.exe" } | ForEach-Object {
          Write-Host "✅ Executable found: $($_.FullName)"
          Write-Host "Size: $([math]::Round($_.Length/1MB, 2)) MB"
        }
        
        if (-not (Test-Path "build\payroll-and-monitoring-system.exe")) {
          Write-Host "❌ Build output not found!"
          exit 1
        }

    - name: Package artifacts
      shell: pwsh
      run: |
        Write-Host "=== Packaging application ==="
        New-Item -ItemType Directory -Force -Path artifact | Out-Null
        
        # Find and copy the executable
        $exe = Get-ChildItem -Recurse build -Filter "payroll-and-monitoring-system.exe" | Select-Object -First 1
        Copy-Item $exe.FullName artifact\
        
        # Copy assets if they exist
        if (Test-Path assets) {
          Copy-Item -Recurse assets artifact\
        }
        
        # Create ZIP archive
        $archiveName = "payroll-and-monitoring-system-windows-${{ inputs.architecture }}-${{ inputs.build_type }}.zip"
        Compress-Archive -Path artifact\* -DestinationPath $archiveName
        
        Write-Host "=== Archive created ==="
        Get-Item $archiveName | ForEach-Object {
          Write-Host "Name: $($_.Name)"
          Write-Host "Size: $([math]::Round($_.Length/1MB, 2)) MB"
        }

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: payroll-and-monitoring-system-windows-${{ inputs.architecture }}-${{ inputs.build_type }}
        path: payroll-and-monitoring-system-windows-${{ inputs.architecture }}-${{ inputs.build_type }}.zip
        retention-days: 90

    - name: Build summary
      shell: pwsh
      run: |
        $archDesc = if ("${{ inputs.architecture }}" -eq "x64") { "x64 (Intel/AMD 64-bit)" } else { "ARM64 (Snapdragon, Surface Pro X)" }
        
        @"
        ### ✅ Build Completed Successfully
        
        **Architecture:** $archDesc
        **Build Type:** ${{ inputs.build_type }}
        **LTO Enabled:** ${{ inputs.enable_lto }}
        **Compiler:** MSVC $(cl.exe 2>&1 | Select-String "Compiler Version" | Out-String)
        
        **Artifact:** payroll-and-monitoring-system-windows-${{ inputs.architecture }}-${{ inputs.build_type }}.zip
        
        Download the artifact from the workflow run page.
        "@ | Out-File -Append $env:GITHUB_STEP_SUMMARY

