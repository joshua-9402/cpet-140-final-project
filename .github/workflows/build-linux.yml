name: Linux (Debian/Ubuntu)

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: 'Linux Distribution'
        required: true
        default: 'ubuntu-22.04'
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-22.04
          - ubuntu-20.04
          - debian-latest
          - debian-12
          - debian-11
      architecture:
        description: 'Target Architecture'
        required: true
        default: 'x64'
        type: choice
        options:
          - x64
          - arm64
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      enable_lto:
        description: 'Enable Link-Time Optimization'
        required: false
        default: true
        type: boolean

jobs:
  build-linux:
    name: ${{ inputs.distribution }} (${{ inputs.architecture }})
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-22.04-arm64' || 'ubuntu-latest' }}
    container:
      image: ${{ inputs.distribution == 'debian-latest' && 'debian:latest' || inputs.distribution == 'debian-12' && 'debian:12' || inputs.distribution == 'debian-11' && 'debian:11' || format('ubuntu:{0}', inputs.distribution == 'ubuntu-latest' && 'latest' || inputs.distribution == 'ubuntu-22.04' && '22.04' || '20.04') }}

    steps:
    - name: System information
      run: |
        echo "=== System Info ==="
        uname -a
        echo ""
        echo "=== Distribution Info ==="
        if [ -f /etc/os-release ]; then
          cat /etc/os-release
        fi
        echo ""
        echo "=== CPU Info ==="
        cat /proc/cpuinfo | grep "model name" | head -1 || echo "ARM CPU"
        echo ""
        echo "=== Architecture ==="
        uname -m
        echo ""
        echo "=== Memory ==="
        free -h 2>/dev/null || echo "Memory info not available"

    - name: Install dependencies (Debian-based distributions)
      run: |
        apt-get update
        apt-get install -y \
          build-essential \
          git \
          cmake \
          ninja-build \
          file \
          libglfw3-dev \
          libwayland-dev \
          wayland-protocols \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libfreetype6-dev \
          libfontconfig1-dev \
          libsodium-dev \
          pkg-config

    - name: Verify libsodium
      run: |
        echo "=== Verifying libsodium ==="
        ldconfig -p | grep sodium || echo "libsodium not in ldconfig (may be okay in container)"
        test -f /usr/include/sodium.h && echo "Header OK" || (echo "Missing sodium.h"; exit 1)
        pkg-config --modversion libsodium || echo "pkg-config entry missing"
        echo "Done"

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Verify tools
      run: |
        echo "=== Verifying build tools ==="
        cmake --version
        ninja --version
        gcc --version
        g++ --version

    - name: Configure CMake
      run: |
        echo "=== Configuring CMake ==="
        echo "Build Type: ${{ inputs.build_type }}"
        
        if [ "${{ inputs.build_type }}" = "Release" ]; then
          echo ""
          echo "ENFORCING RELEASE BUILD MODE"
          echo "Optimizations: -O3 -DNDEBUG"
          echo "This build MUST NOT contain debug symbols"
          echo ""
        fi
        
        CMAKE_ARGS="-B build -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} -G Ninja"
        
        if [ "${{ inputs.build_type }}" = "Release" ]; then
          CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_C_FLAGS_RELEASE=-O3 -DNDEBUG -DCMAKE_CXX_FLAGS_RELEASE=-O3 -DNDEBUG"
        fi
        
        if [ "${{ inputs.enable_lto }}" = "false" ]; then
          CMAKE_ARGS="$CMAKE_ARGS -DNO_LTO=ON"
        fi
        
        cmake $CMAKE_ARGS

    - name: Build
      run: |
        echo "=== Building application (Build Type: ${{ inputs.build_type }}) ==="
        cmake --build build --config ${{ inputs.build_type }} -j $(nproc)

    - name: Verify build output
      run: |
        echo "=== Checking build output ==="
        ls -lh build/
        if [ -f "build/structuracost" ]; then
          echo "✅ Executable found"
          ls -lh build/structuracost
          file build/structuracost
          ldd build/structuracost || echo "Static build or libraries not found"
        else
          echo "❌ Build output not found!"
          exit 1
        fi

    - name: Package artifacts
      run: |
        echo "=== Packaging application ==="
        mkdir -p artifact
        
        # Copy executable
        cp build/structuracost artifact/
        
        # Copy assets
        if [ -d "assets" ]; then
          cp -r assets artifact/
        fi
        
        DIST_NAME=$(echo "${{ inputs.distribution }}" | sed 's/:/-/g' | sed 's/\//-/g')
        ARCHIVE_NAME="structuracost-${DIST_NAME}-${{ inputs.architecture }}-${{ inputs.build_type }}.tar.gz"
        
        cd artifact
        tar -czf ../${ARCHIVE_NAME} *
        cd ..
        
        echo "=== Archive created ==="
        ls -lh ${ARCHIVE_NAME}
        echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: structuracost-${{ inputs.distribution }}-${{ inputs.architecture }}-${{ inputs.build_type }}
        path: ${{ env.ARCHIVE_NAME }}
        retention-days: 90
        compression-level: 0

    - name: Build summary
      run: |
        cat << EOF >> $GITHUB_STEP_SUMMARY
        ### ✅ Build Completed Successfully
        
        **Distribution:** ${{ inputs.distribution }}
        **Architecture:** ${{ inputs.architecture }}
        **Build Type:** ${{ inputs.build_type }}
        **LTO Enabled:** ${{ inputs.enable_lto }}
        **Compiler:** GCC $(gcc --version | head -1)
        
        **Artifact:** ${ARCHIVE_NAME}
        
        Download the artifact from the workflow run page.
        
        **Note:** This binary is built for ${{ inputs.distribution }} on ${{ inputs.architecture }}.
        It may work on other distributions but testing is recommended.
        EOF
