name: Build macOS ARM64 (Manual)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      enable_lto:
        description: 'Enable Link-Time Optimization'
        required: false
        default: true
        type: boolean

jobs:
  build-macos-arm64:
    name: macOS Sonoma ARM64
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: System information
      run: |
        echo "=== System Info ==="
        sw_vers
        uname -m
        echo "=== CPU Info ==="
        sysctl -n machdep.cpu.brand_string
        echo "=== Available cores ==="
        sysctl -n hw.ncpu

    - name: Install dependencies
      run: |
        echo "=== Installing dependencies with Homebrew ==="
        brew install cmake ninja freetype
        echo "=== Verifying installations ==="
        cmake --version
        ninja --version
        clang++ --version

    - name: Configure CMake
      run: |
        echo "=== Configuring CMake ==="
        if [ "${{ inputs.enable_lto }}" = "true" ]; then
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} \
            -G Ninja \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
        else
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} \
            -G Ninja \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DNO_LTO=ON
        fi

    - name: Build
      run: |
        echo "=== Building application ==="
        cmake --build build --config ${{ inputs.build_type }} -j $(sysctl -n hw.ncpu)

    - name: Verify build output
      run: |
        echo "=== Checking build output ==="
        ls -lh build/
        if [ -d "build/payroll-and-monitoring-system.app" ]; then
          echo "✅ App bundle created"
          ls -lh build/payroll-and-monitoring-system.app/Contents/MacOS/
        elif [ -f "build/payroll-and-monitoring-system" ]; then
          echo "✅ Executable created"
          ls -lh build/payroll-and-monitoring-system
          file build/payroll-and-monitoring-system
        else
          echo "❌ Build output not found!"
          exit 1
        fi

    - name: Package artifacts
      run: |
        echo "=== Packaging application ==="
        mkdir -p artifact
        
        # Check for app bundle first
        if [ -d "build/payroll-and-monitoring-system.app" ]; then
          echo "Packaging .app bundle"
          cp -r build/payroll-and-monitoring-system.app artifact/
          # Create DMG-ready structure
          mkdir -p artifact/Applications
          ln -s /Applications artifact/Applications
        else
          echo "Packaging standalone executable"
          cp build/payroll-and-monitoring-system artifact/
        fi
        
        # Copy assets
        if [ -d "assets" ]; then
          cp -r assets artifact/
        fi
        
        # Create archive
        cd artifact
        tar -czf ../payroll-and-monitoring-system-macos-arm64-${{ inputs.build_type }}.tar.gz *
        cd ..
        
        echo "=== Archive created ==="
        ls -lh payroll-and-monitoring-system-macos-arm64-${{ inputs.build_type }}.tar.gz

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: payroll-and-monitoring-system-macos-arm64-${{ inputs.build_type }}
        path: payroll-and-monitoring-system-macos-arm64-${{ inputs.build_type }}.tar.gz
        retention-days: 90
        compression-level: 0

    - name: Build summary
      run: |
        echo "### ✅ Build Completed Successfully" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Platform:** macOS ARM64 (Apple Silicon)" >> $GITHUB_STEP_SUMMARY
        echo "**Build Type:** ${{ inputs.build_type }}" >> $GITHUB_STEP_SUMMARY
        echo "**LTO Enabled:** ${{ inputs.enable_lto }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Artifact:** payroll-and-monitoring-system-macos-arm64-${{ inputs.build_type }}.tar.gz" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Download the artifact from the workflow run page." >> $GITHUB_STEP_SUMMARY

