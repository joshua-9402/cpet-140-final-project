name: Multi-Platform Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          # Linux builds
          - {
              name: "Ubuntu Latest (x64)",
              os: ubuntu-latest,
              arch: x64,
              artifact: "payroll-and-monitoring-system-linux-x64",
              build_type: "Release"
            }

          # macOS builds
          - {
              name: "macOS Latest (ARM64)",
              os: macos-latest,
              arch: arm64,
              artifact: "payroll-and-monitoring-system-macos-arm64",
              build_type: "Release",
              cc: "clang",
              cxx: "clang++"
            }
          - {
              name: "macOS 13 (x64)",
              os: macos-13,
              arch: x64,
              artifact: "payroll-and-monitoring-system-macos-x64",
              build_type: "Release",
              cc: "clang",
              cxx: "clang++"
            }

          # Windows builds
          - {
              name: "Windows Latest (x64)",
              os: windows-latest,
              arch: x64,
              artifact: "payroll-and-monitoring-system-windows-x64",
              build_type: "Release"
            }

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # Install dependencies for Linux
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libfreetype6-dev \
          libfontconfig1-dev

    # Install dependencies for macOS
    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      run: |
        brew install cmake ninja freetype

    # Install dependencies for Windows
    - name: Install Windows dependencies
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install ninja -y
        ninja --version

    # Configure CMake for Linux/Windows
    - name: Configure CMake (Linux/Windows)
      if: runner.os != 'macOS'
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} -G Ninja

    # Configure CMake for macOS (native build)
    - name: Configure CMake (macOS)
      if: runner.os == 'macOS'
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} -G Ninja

    # Build
    - name: Build
      run: cmake --build build --config ${{ matrix.config.build_type }} -j 4

    # Verify build output
    - name: Verify build output
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          ls -lh build/payroll-and-monitoring-system || (echo "Build failed - executable not found" && exit 1)
        elif [ "$RUNNER_OS" == "macOS" ]; then
          ls -lh build/payroll-and-monitoring-system* || (echo "Build failed - executable not found" && exit 1)
        elif [ "$RUNNER_OS" == "Windows" ]; then
          ls -lh build/payroll-and-monitoring-system.exe || ls -lh build/Release/payroll-and-monitoring-system.exe || (echo "Build failed - executable not found" && exit 1)
        fi

    # Package artifacts for Linux
    - name: Package Linux artifacts
      if: runner.os == 'Linux'
      run: |
        mkdir -p artifact
        cp build/payroll-and-monitoring-system artifact/
        cp -r assets artifact/
        cd artifact
        tar -czf ../${{ matrix.config.artifact }}.tar.gz *

    # Package artifacts for macOS
    - name: Package macOS artifacts
      if: runner.os == 'macOS'
      run: |
        mkdir -p artifact
        if [ -d "build/payroll-and-monitoring-system.app" ]; then
          cp -r build/payroll-and-monitoring-system.app artifact/
        else
          cp build/payroll-and-monitoring-system artifact/
          cp -r assets artifact/
        fi
        cd artifact
        tar -czf ../${{ matrix.config.artifact }}.tar.gz *

    # Package artifacts for Windows
    - name: Package Windows artifacts
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifact
        if (Test-Path "build/payroll-and-monitoring-system.exe") {
          Copy-Item build/payroll-and-monitoring-system.exe artifact/
        } elseif (Test-Path "build/Release/payroll-and-monitoring-system.exe") {
          Copy-Item build/Release/payroll-and-monitoring-system.exe artifact/
        } else {
          Write-Error "Could not find executable"
          exit 1
        }
        Copy-Item -Recurse assets artifact/
        Compress-Archive -Path artifact/* -DestinationPath ${{ matrix.config.artifact }}.zip

    # Upload Linux/macOS artifacts
    - name: Upload artifacts (Linux/macOS)
      if: runner.os != 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.config.artifact }}
        path: ${{ matrix.config.artifact }}.tar.gz
        retention-days: 30

    # Upload Windows artifacts
    - name: Upload artifacts (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.config.artifact }}
        path: ${{ matrix.config.artifact }}.zip
        retention-days: 30

  # Create release on tags
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

