name: macOS

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'macOS Target'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - intel
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      enable_lto:
        description: 'Enable Link-Time Optimization'
        required: false
        default: true
        type: boolean

jobs:
  build-macos:
    name: macOS (${{ inputs.target }})
    runs-on: ${{ inputs.target == 'arm64' && 'macos-14' || inputs.target == 'intel' && 'macos-15' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: System information
      run: |
        echo "=== System Info ==="
        sw_vers
        uname -m
        echo "=== CPU Info ==="
        sysctl -n machdep.cpu.brand_string
        echo "=== Available cores ==="
        sysctl -n hw.ncpu

    - name: Install dependencies
      run: |
        echo "=== Installing dependencies with Homebrew ==="
        brew install cmake ninja freetype libsodium
        echo "=== Verifying installations ==="
        cmake --version
        ninja --version
        clang++ --version

    - name: Verify libsodium
      run: |
        echo "=== Verifying libsodium ==="
        test -f /opt/homebrew/include/sodium.h || test -f /usr/local/include/sodium.h || (echo "sodium.h not found"; exit 1)
        ls /opt/homebrew/lib/libsodium* 2>/dev/null || ls /usr/local/lib/libsodium* 2>/dev/null || echo "libsodium library not listed"
        echo "Verification complete"

    - name: Configure CMake
      run: |
        echo "=== Configuring CMake ==="
        if [ "${{ inputs.target }}" = "arm64" ]; then
          DEPLOYMENT_TARGET="14.0"
          ARCH="arm64"
        else
          DEPLOYMENT_TARGET="15.0"
          ARCH="x86_64"
        fi
        LTO_FLAGS=""
        if [ "${{ inputs.enable_lto }}" = "true" ]; then
          LTO_FLAGS="-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON"
        else
          LTO_FLAGS="-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF"
        fi
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} \
          -G Ninja \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=$DEPLOYMENT_TARGET \
          -DCMAKE_OSX_ARCHITECTURES=$ARCH \
          $LTO_FLAGS

    - name: Build
      run: |
        echo "=== Building application ==="
        cmake --build build --config ${{ inputs.build_type }} -j $(sysctl -n hw.ncpu)

    - name: Verify build output
      run: |
        echo "=== Checking build output ==="
        ls -lh build/
        if [ -d "build/structuracost.app" ]; then
          echo "✅ App bundle created"
          ls -lh build/structuracost.app/Contents/MacOS/
          file build/structuracost.app/Contents/MacOS/structuracost
        elif [ -f "build/structuracost" ]; then
          echo "✅ Executable created"
          ls -lh build/structuracost
          file build/structuracost
        else
          echo "❌ Build output not found!"
          exit 1
        fi

    - name: Package artifacts
      run: |
        echo "=== Packaging application ==="
        mkdir -p artifact
        if [ -d "build/structuracost.app" ]; then
          echo "Packaging .app bundle"
          cp -R build/structuracost.app artifact/
        else
          echo "Packaging standalone executable"
          cp build/structuracost artifact/
          if [ -d "assets" ]; then
            cp -R assets artifact/
          fi
        fi
        cd artifact
        tar -czf ../structuracost-macos-${{ inputs.target }}-${{ inputs.build_type }}.tar.gz *
        cd ..
        echo "=== Archive created ==="
        ls -lh structuracost-macos-${{ inputs.target }}-${{ inputs.build_type }}.tar.gz

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: structuracost-macos-${{ inputs.target }}-${{ inputs.build_type }}
        path: structuracost-macos-${{ inputs.target }}-${{ inputs.build_type }}.tar.gz
        retention-days: 90

    - name: Build summary
      run: |
        TARGET_NAME="${{ inputs.target }}"
        if [ "$TARGET_NAME" = "arm64" ]; then
          TARGET_DESC="Apple Silicon (M1/M2/M3/M4) - macOS 14.0+"
        else
          TARGET_DESC="Intel (x64) - macOS 15.0+"
        fi
        cat << EOF >> $GITHUB_STEP_SUMMARY
        ### ✅ Build Completed Successfully
        **Target:** $TARGET_DESC
        **Build Type:** ${{ inputs.build_type }}
        **LTO Enabled:** ${{ inputs.enable_lto }}
        **Compiler:** $(clang++ --version | head -1)
        **Artifact:** structuracost-macos-${{ inputs.target }}-${{ inputs.build_type }}.tar.gz
        Download the artifact from the workflow run page.
        EOF
