name: macOS

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'macOS Target'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - intel
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      enable_lto:
        description: 'Enable Link-Time Optimization'
        required: false
        default: true
        type: boolean

jobs:
  build-macos:
    name: macOS (${{ inputs.target }})
    runs-on: ${{ inputs.target == 'arm64' && 'macos-14' || inputs.target == 'intel' && 'macos-13' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: System information
      run: |
        echo "=== System Info ==="
        sw_vers
        uname -m
        echo "=== CPU Info ==="
        sysctl -n machdep.cpu.brand_string
        echo "=== Available cores ==="
        sysctl -n hw.ncpu

    - name: Install dependencies
      run: |
        echo "=== Installing dependencies with Homebrew ==="
        brew install cmake ninja freetype libsodium
        echo "=== Verifying installations ==="
        cmake --version
        ninja --version
        clang++ --version

    - name: Configure CMake
      run: |
        echo "=== Configuring CMake ==="
        
        # Set deployment target based on selection
        if [ "${{ inputs.target }}" = "arm64" ]; then
          DEPLOYMENT_TARGET="14.0"
        elif [ "${{ inputs.target }}" = "intel" ]; then
          DEPLOYMENT_TARGET="11.0"
        fi
        
        if [ "${{ inputs.enable_lto }}" = "true" ]; then
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} \
            -G Ninja \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$DEPLOYMENT_TARGET \
            ${CMAKE_OSX_ARCHITECTURES:+-DCMAKE_OSX_ARCHITECTURES=$CMAKE_OSX_ARCHITECTURES}
        else
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} \
            -G Ninja \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$DEPLOYMENT_TARGET \
            ${CMAKE_OSX_ARCHITECTURES:+-DCMAKE_OSX_ARCHITECTURES=$CMAKE_OSX_ARCHITECTURES} \
            -DNO_LTO=ON
        fi

    - name: Build
      run: |
        echo "=== Building application ==="
        cmake --build build --config ${{ inputs.build_type }} -j $(sysctl -n hw.ncpu)

    - name: Verify build output
      run: |
        echo "=== Checking build output ==="
        ls -lh build/
        if [ -d "build/payroll-and-monitoring-system.app" ]; then
          echo "✅ App bundle created"
          ls -lh build/payroll-and-monitoring-system.app/Contents/MacOS/
          file build/payroll-and-monitoring-system.app/Contents/MacOS/payroll-and-monitoring-system
        elif [ -f "build/payroll-and-monitoring-system" ]; then
          echo "✅ Executable created"
          ls -lh build/payroll-and-monitoring-system
          file build/payroll-and-monitoring-system
        else
          echo "❌ Build output not found!"
          exit 1
        fi

    - name: Package artifacts
      run: |
        echo "=== Packaging application ==="
        mkdir -p artifact
        
        # Check for app bundle first
        if [ -d "build/payroll-and-monitoring-system.app" ]; then
          echo "Packaging .app bundle"
          cp -r build/payroll-and-monitoring-system.app artifact/
        else
          echo "Packaging standalone executable"
          cp build/payroll-and-monitoring-system artifact/
          # Copy assets if they exist
          if [ -d "assets" ]; then
            cp -r assets artifact/
          fi
        fi
        
        # Create archive
        cd artifact
        tar -czf ../payroll-and-monitoring-system-macos-${{ inputs.target }}-${{ inputs.build_type }}.tar.gz *
        cd ..
        
        echo "=== Archive created ==="
        ls -lh payroll-and-monitoring-system-macos-${{ inputs.target }}-${{ inputs.build_type }}.tar.gz

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: payroll-and-monitoring-system-macos-${{ inputs.target }}-${{ inputs.build_type }}
        path: payroll-and-monitoring-system-macos-${{ inputs.target }}-${{ inputs.build_type }}.tar.gz
        retention-days: 90

    - name: Build summary
      run: |
        TARGET_NAME="${{ inputs.target }}"
        if [ "$TARGET_NAME" = "arm64" ]; then
          TARGET_DESC="Apple Silicon (M1/M2/M3/M4) - macOS 14.0+"
        elif [ "$TARGET_NAME" = "intel" ]; then
          TARGET_DESC="Intel (x64) - macOS 11.0+"
        fi
        
        cat << EOF >> $GITHUB_STEP_SUMMARY
        ### ✅ Build Completed Successfully
        
        **Target:** $TARGET_DESC
        **Build Type:** ${{ inputs.build_type }}
        **LTO Enabled:** ${{ inputs.enable_lto }}
        **Compiler:** $(clang++ --version | head -1)
        
        **Artifact:** payroll-and-monitoring-system-macos-${{ inputs.target }}-${{ inputs.build_type }}.tar.gz
        
        Download the artifact from the workflow run page.
        EOF
